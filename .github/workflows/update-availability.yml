name: Update availability calendar

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate json/availability.json
        env:
          CALENDAR_FEED_URL: ${{ secrets.CALENDAR_FEED_URL }}
        run: node scripts/generate-availability.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- json/availability.json; then
            echo "No changes to json/availability.json."
          else
            git add json/availability.json
            git commit -m "Auto-update availability calendar"
            git push
          fi
