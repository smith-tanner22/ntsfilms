<script>
  const form = document.getElementById("contactForm");
  const projectType = document.getElementById("projectType");
  const weddingFields = document.getElementById("weddingFields");
  const projectFields = document.getElementById("projectFields");
  const projectFocus = document.getElementById("projectFocus");
  const projectFocusLabel = document.getElementById("projectFocusLabel");
  const projectGoalLabel = document.getElementById("projectGoalLabel");
  const projectGoal = document.getElementById("projectGoal");
  const messageLabel = document.getElementById("messageLabel");
  const message = document.getElementById("message");
  const templeWedding = document.getElementById("templeWedding");
  const templeExitField = document.getElementById("templeExitField");
  const templeExit = document.getElementById("templeExit");

  const projectPrompts = {
    corporate: {
      focusLabel: "What kind of corporate video do you need? *",
      goalLabel: "What should this video help your business accomplish?",
      goalPlaceholder: "Examples: internal training, brand story, recruiting, conference recap, product explanation.",
      messageLabel: "Tell us more about the company, audience, and timeline.",
      messagePlaceholder: "Share any brand requirements, key stakeholders, filming restrictions, or examples you like.",
      options: ["Brand story", "Training / internal video", "Recruiting video", "Conference or meeting recap", "Product / service explainer", "Other"]
    },
    event: {
      focusLabel: "What kind of event video do you need? *",
      goalLabel: "What moments matter most for the event film?",
      goalPlaceholder: "Examples: speeches, performances, sponsor moments, attendee reactions, full recap.",
      messageLabel: "Tell us more about the event and what needs to be captured.",
      messagePlaceholder: "Include schedule notes, must-capture moments, venue details, or delivery needs.",
      options: ["Conference", "Fundraiser", "Concert / performance", "Party / celebration", "Sports / competition", "Other"]
    },
    musicVideo: {
      focusLabel: "What style of music video are you planning? *",
      goalLabel: "What is the concept or visual direction?",
      goalPlaceholder: "Share the song, references, locations, performance/narrative ideas, and overall vibe.",
      messageLabel: "Tell us more about the artist, song, and production needs.",
      messagePlaceholder: "Include release timeline, crew needs, locations, props, and whether editing is included.",
      options: ["Performance video", "Narrative video", "Live session", "Lyric / visualizer support", "Not sure yet", "Other"]
    },
    commercial: {
      focusLabel: "What kind of commercial are you making? *",
      goalLabel: "What action should the audience take after watching?",
      goalPlaceholder: "Examples: buy a product, book a service, visit a location, sign up, build brand awareness.",
      messageLabel: "Tell us more about the offer, audience, and campaign.",
      messagePlaceholder: "Include usage plans, platforms, script status, actors, locations, and deadline.",
      options: ["Product ad", "Service ad", "Social media campaign", "Testimonial", "Local TV / web spot", "Other"]
    },
    documentary: {
      focusLabel: "What kind of documentary project is this? *",
      goalLabel: "What story are you trying to tell?",
      goalPlaceholder: "Share the subject, access, interviews, existing footage, and the intended audience.",
      messageLabel: "Tell us more about the story, scope, and current stage.",
      messagePlaceholder: "Include expected length, research status, interview list, locations, and editing needs.",
      options: ["Short documentary", "Feature documentary", "Docu-style brand film", "Interview series", "Proof of concept", "Other"]
    },
    realEstate: {
      focusLabel: "What kind of real estate video do you need? *",
      goalLabel: "What should the property video highlight?",
      goalPlaceholder: "Examples: luxury features, neighborhood, amenities, agent intro, social-first vertical edits.",
      messageLabel: "Tell us more about the property and listing timeline.",
      messagePlaceholder: "Include address or area, square footage, access windows, listing date, and deliverables.",
      options: ["Listing walkthrough", "Luxury property film", "Agent branding video", "Neighborhood feature", "Commercial property", "Other"]
    },
    other: {
      focusLabel: "What kind of project is this? *",
      goalLabel: "What are you hoping the finished video accomplishes?",
      goalPlaceholder: "Tell us the project type, audience, and what you want the video to do.",
      messageLabel: "Tell us more about the project.",
      messagePlaceholder: "Share any dates, locations, examples, deliverables, and questions you have.",
      options: ["Personal project", "Social media content", "Editing help", "Filming help", "Not sure yet", "Other"]
    }
  };

  function setSectionEnabled(section, enabled) {
    section.classList.toggle("is-hidden", !enabled);
    section.querySelectorAll("input, select, textarea").forEach((field) => {
      field.disabled = !enabled;
      if (field.dataset.requiredWhen) {
        field.required = enabled;
      }
    });
  }

  function updateTempleExit() {
    const showTempleExit = projectType.value === "wedding" && templeWedding.checked;
    templeExitField.classList.toggle("is-hidden", !showTempleExit);
    templeExit.disabled = !showTempleExit;
    if (!showTempleExit) {
      templeExit.value = "";
    }
  }

  function updateProjectPrompts(type) {
    const prompt = projectPrompts[type] || projectPrompts.other;
    projectFocusLabel.textContent = prompt.focusLabel;
    projectGoalLabel.textContent = prompt.goalLabel;
    projectGoal.placeholder = prompt.goalPlaceholder;
    messageLabel.textContent = prompt.messageLabel;
    message.placeholder = prompt.messagePlaceholder;
    projectFocus.innerHTML = '<option value="">Select one</option>' + prompt.options
      .map((option) => `<option value="${option}">${option}</option>`)
      .join("");
  }

  function updateForm() {
    const type = projectType.value;
    const isWedding = type === "wedding";
    const isProject = type && !isWedding;

    setSectionEnabled(weddingFields, isWedding);
    setSectionEnabled(projectFields, isProject);

    if (isProject) {
      updateProjectPrompts(type);
    } else {
      messageLabel.textContent = "Tell us more about yourself and the wedding you are planning!";
      message.placeholder = "Tell us about your wedding vision, questions you have for us, etc.!";
    }

    updateTempleExit();
  }

  projectType.addEventListener("change", updateForm);
  templeWedding.addEventListener("change", updateTempleExit);

  form.addEventListener("submit", (e) => {
    if (projectType.value === "wedding") {
      const checks = form.querySelectorAll('input[name="weddingType[]"]');
      const anyChecked = Array.from(checks).some(c => c.checked);

      if (!anyChecked) {
        e.preventDefault();
        alert("Please select at least one Wedding Type.");
      }
    }
  });

  updateForm();
</script>
